name: Release DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin la v, por ejemplo 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Las notas de la release se generan desde los commits, asi que hace
          # falta el historial y los tags, no solo el commit del tag.
          fetch-depth: 0

      - name: Show Swift version
        run: swift --version

      - name: Run self-tests
        run: swift run UsageTrackerSelfTest

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "No se pudo determinar la versión." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      - name: Build release app
        env:
          USAGE_TRACKER_VERSION: ${{ steps.version.outputs.version }}
          USAGE_TRACKER_BUILD: ${{ github.run_number }}
        run: ./build.sh release

      - name: Verify code signature
        run: codesign --verify --deep --strict --verbose=2 "Usage Tracker.app"

      - name: Create DMG
        run: ./scripts/package-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-notes.sh "$VERSION" > release-notes.md

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsageTracker-${{ steps.version.outputs.version }}.dmg
          path: release/UsageTracker-${{ steps.version.outputs.version }}.dmg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/UsageTracker-${{ steps.version.outputs.version }}.dmg
          body_path: release-notes.md
